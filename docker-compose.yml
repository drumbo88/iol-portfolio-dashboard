services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://backend:3001
      VITE_USEPOLLING : "true"
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev:client -- --host 0.0.0.0"
    depends_on:
      - backend

  backend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./server:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./server/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    expose:
      - "3001"
    command: sh -c "npm ci && npm run dev"

volumes:
  frontend_node_modules:
  backend_node_modules:
